services:
  db:
    image: pgvector/pgvector:pg16
    container_name: arxiv-rag-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arxiv_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arxiv_rag}
      POSTGRES_DB: ${POSTGRES_DB:-arxiv_rag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Lightweight web DB UI — opt-in: `make ui` → http://localhost:8081
  # (log in with server=db, user/password/database from .env)
  adminer:
    image: adminer:4
    profiles: ["ui"]
    container_name: arxiv-rag-adminer
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
