services:
  db:
    image: pgvector/pgvector:pg16
    container_name: arxiv-rag-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arxiv_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arxiv_rag}
      POSTGRES_DB: ${POSTGRES_DB:-arxiv_rag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The API container doubles as the CLI runner:
  #   docker compose run --rm api arxiv-rag ingest --limit 1000
  api:
    build:
      context: .
    container_name: arxiv-rag-api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-arxiv_rag}:${POSTGRES_PASSWORD:-arxiv_rag}@db:5432/${POSTGRES_DB:-arxiv_rag}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Alibaba-NLP/gte-modernbert-base}
      EMBED_DIM: ${EMBED_DIM:-768}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-32}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      MIN_SCORE: ${MIN_SCORE:-0.25}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-12000}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    volumes:
      - hf-cache:/home/appuser/.cache/huggingface
    command: sh -c "alembic upgrade head && uvicorn arxiv_rag.api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # Lightweight web DB UI — opt-in: `make ui` → http://localhost:8081
  # (log in with server=db, user/password/database from .env)
  adminer:
    image: adminer:4
    profiles: ["ui"]
    container_name: arxiv-rag-adminer
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  hf-cache:
