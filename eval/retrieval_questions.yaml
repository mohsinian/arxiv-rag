    expected: ["2604.08499", "2603.14417", "2601.15331"]
  - question: "why do we need type safe LLm model?"
    expected: ["2609.33209"]
  - question: "how much effect soya sauce has in Chinese cooking?"
    expected: ["none"]
  - question: "what methods to follow to get better at penalty shootout?"
    expected: ["none"]
  - question: "if the first world war never happened, what were the chances of the second world war?"
    expected: ["none"]
