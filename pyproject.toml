[project]
name = "arxiv-rag"
version = "0.1.0"
description = "Ingest arXiv papers, store them in Postgres, serve aggregate stats and RAG answers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic-settings>=2",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pgvector>=0.3",
    "psycopg[binary]>=3.1",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sentence-transformers>=3",
    "openai>=1.40",
]

[project.scripts]
arxiv-rag = "arxiv_rag.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyyaml>=6",
    "types-PyYAML>=6",
    "pgcli>=4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not slow'"
markers = [
    "unit: fast tests with no external dependencies (DB, network, model weights)",
    "integration: tests that need a running Postgres (see `make test-integration`)",
    "slow: tests that download model weights or take minutes (run explicitly)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "typer.Argument", "typer.Option"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
]
